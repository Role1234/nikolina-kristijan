<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#171313"
    >

    <meta
        name="color-scheme"
        content="light"
    >

    <title>Nikolina & Kristijan</title>


    <!-- =====================================================
         PRELOAD INTRO FOTOGRAFIJE
         Browser počinje učitavati fotografiju što ranije.
    ====================================================== -->

    <link
        rel="preload"
        as="image"
        href="https://drive.google.com/thumbnail?id=1eydvV_aokZILZUnT0DiVF65T8Gf9BcqZ&sz=w1600"
        fetchpriority="high"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }


        body {
            background: #f8f6f3;
            color: #3d3734;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        body.no-scroll {
            overflow: hidden;
            touch-action: none;
        }


        button,
        img {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           INTRO
        ===================================================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #171313;

            color: white;

            opacity: 1;

            visibility: visible;

            transition:
                opacity 1.4s ease,
                visibility 1.4s ease;

        }


        #intro.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        /*
            Dok se fotografija učitava,
            intro ostaje taman i elegantan.
        */

        #intro.loading-photo {
            background: #171313;
        }


        /* =====================================================
           BLURRED BACKGROUND
        ===================================================== */

        #intro::before {

            content: "";

            position: absolute;

            inset: -60px;

            background-image:

                linear-gradient(
                    rgba(0,0,0,.30),
                    rgba(0,0,0,.52)
                ),

                url(
                    "https://drive.google.com/thumbnail?id=1eydvV_aokZILZUnT0DiVF65T8Gf9BcqZ&sz=w1600"
                );

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            filter: blur(32px);

            transform: scale(1.12);

            opacity: .82;

            z-index: 0;

            transition:
                opacity 1s ease;

        }


        /* =====================================================
           DARK OVERLAY
        ===================================================== */

        #intro::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.12),
                    rgba(0,0,0,.34)
                );

            z-index: 1;

            pointer-events: none;

        }


        /* =====================================================
           INTRO CONTENT
        ===================================================== */

        .intro-content {

            position: relative;

            z-index: 5;

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            opacity: 0;

            animation:
                introContentIn 1.1s ease .15s forwards;

        }


        @keyframes introContentIn {

            from {

                opacity: 0;

                transform:
                    scale(.985);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        /* =====================================================
           MAIN PORTRAIT
        ===================================================== */

        .intro-photo {

            position: absolute;

            z-index: 2;

            width: min(80vw, 650px);

            height: min(92vh, 900px);

            background-image: none;

            background-size: contain;

            background-position: center;

            background-repeat: no-repeat;

            opacity: 0;

            transform:
                scale(.985);

            filter:
                drop-shadow(
                    0 15px 35px rgba(0,0,0,.55)
                );

            transition:
                opacity 1s ease,
                transform 1.2s ease;

        }


        /*
            Aktivira se tek kada je fotografija
            stvarno učitana.
        */

        #intro.image-loaded .intro-photo {

            opacity: 1;

            transform:
                scale(1);

        }


        /* =====================================================
           SUBTLE FRAME
        ===================================================== */

        .intro-photo-frame {

            position: absolute;

            z-index: 3;

            width: min(45vw, 550px);

            height: min(91vh, 880px);

            border:
                1px solid
                rgba(255,255,255,.15);

            pointer-events: none;

        }


        /* =====================================================
           INTRO TEXT
        ===================================================== */

        .intro-text {

            position: absolute;

            left: 50%;

            bottom: clamp(5%, 8vh, 10%);

            transform:
                translateX(-50%);

            width: min(92vw, 900px);

            padding:
                25px 20px;

            background:

                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0),
                    rgba(0,0,0,.18)
                );

            text-align: center;

        }


        .intro-content h1 {

            font-size:
                clamp(24px, 3.5vw, 50px);

            font-weight: normal;

            line-height: 1.1;

            letter-spacing: 1px;

            white-space: nowrap;

            color: #fff;

            text-shadow:

                0 3px 20px rgba(0,0,0,.75),

                0 1px 4px rgba(0,0,0,.9);

        }


        .intro-line {

            width: 90px;

            height: 1px;

            margin:
                20px auto;

            background:
                rgba(255,255,255,.8);

        }


        .intro-date {

            font-size:
                clamp(16px, 2.5vw, 25px);

            letter-spacing: 7px;

            color:
                rgba(255,255,255,.95);

            text-shadow:

                0 2px 12px rgba(0,0,0,.9);

        }


        .intro-scroll {

            margin-top: 22px;

            font-family:
                Arial,
                sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: .65;

        }


        /* =====================================================
           INTRO LOADING INDICATOR
        ===================================================== */

        .intro-loader {

            position: absolute;

            left: 50%;

            top: 50%;

            z-index: 10;

            width: 24px;

            height: 24px;

            margin:
                -12px 0 0 -12px;

            border:
                1px solid
                rgba(255,255,255,.25);

            border-top-color:
                rgba(255,255,255,.9);

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

            opacity: .8;

            transition:
                opacity .5s ease;

        }


        #intro.image-loaded .intro-loader {

            opacity: 0;

            pointer-events: none;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: 100%;

            max-width: 1800px;

            margin: 0 auto;

            padding:
                85px 30px 90px;

        }


        /* =====================================================
           HEADING
        ===================================================== */

        .heading {

            text-align: center;

            margin-bottom: 55px;

        }


        .heading h2 {

            font-size:
                clamp(30px, 4vw, 50px);

            font-weight: normal;

            letter-spacing: .5px;

        }


        .heading p {

            margin-top: 14px;

            color: #968981;

            font-size: 16px;

        }


        .heart {

            color: #b99384;

            margin:
                0 7px;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading {

            text-align: center;

            padding: 80px 20px;

            color: #998d86;

        }


        .spinner {

            width: 42px;

            height: 42px;

            margin:
                0 auto 20px;

            border:
                2px solid
                #ded8d4;

            border-top-color:
                #998d86;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           GALLERY
        ===================================================== */

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            align-items: start;

        }


        .photo {

            position: relative;

            overflow: hidden;

            background:
                #e9e5e1;

            border-radius: 5px;

            cursor: pointer;

            opacity: 0;

            transform:
                translateY(18px);

            animation:
                photoIn .7s ease forwards;

            contain:
                layout paint;

        }


        .photo img {

            display: block;

            width: 100%;

            height: auto;

            min-height: 80px;

            object-fit: contain;

            background:
                #eeeae7;

            transition:

                transform .6s ease,

                filter .5s ease;

        }


        .photo:hover img {

            transform:
                scale(1.025);

            filter:
                brightness(.88);

        }


        .photo::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    to bottom,
                    transparent 70%,
                    rgba(0,0,0,.15)
                );

            opacity: 0;

            transition:
                opacity .35s ease;

        }


        .photo:hover::after {

            opacity: 1;

        }


        @keyframes photoIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           ERROR
        ===================================================== */

        #error {

            display: none;

            max-width: 650px;

            margin:
                60px auto;

            padding: 30px;

            text-align: center;

            background:
                #f8eeee;

            color:
                #875f57;

            border-radius: 8px;

        }


        #error h3 {

            font-size: 22px;

            font-weight: normal;

            margin-bottom: 15px;

        }


        /* =====================================================
           LIGHTBOX
        ===================================================== */

        #lightbox {

            position: fixed;

            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(8,8,8,.97);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:

                opacity .3s ease,

                visibility .3s ease;

            overscroll-behavior: contain;

            touch-action: pan-y;

        }


        #lightbox.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        #lightbox-image {

            display: block;

            width: auto;

            height: auto;

            max-width: 94vw;

            max-height: 90vh;

            object-fit: contain;

            box-shadow:

                0 15px 70px
                rgba(0,0,0,.7);

            user-select: none;

            -webkit-user-drag: none;

            -webkit-touch-callout: none;

            animation:
                lightboxIn .3s ease;

        }


        @keyframes lightboxIn {

            from {

                opacity: 0;

                transform:
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        /* =====================================================
           LIGHTBOX LOADING
        ===================================================== */

        #lightbox-loader {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 36px;

            height: 36px;

            margin:
                -18px 0 0 -18px;

            border:
                2px solid
                rgba(255,255,255,.2);

            border-top-color:
                rgba(255,255,255,.9);

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

            opacity: 0;

            pointer-events: none;

        }


        #lightbox.loading #lightbox-loader {

            opacity: 1;

        }


        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        #close {

            position: absolute;

            top: 15px;

            right: 22px;

            z-index: 20;

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-family:
                Arial,
                sans-serif;

            font-size: 38px;

            font-weight: 200;

            cursor: pointer;

            border-radius: 50%;

            background:
                rgba(255,255,255,.06);

            transition:
                background .2s ease;

        }


        #close:hover {

            background:
                rgba(255,255,255,.15);

        }


        /* =====================================================
           LIGHTBOX NAVIGATION
        ===================================================== */

        .nav {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 20;

            width: 65px;

            height: 90px;

            border: 0;

            border-radius: 5px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 38px;

            cursor: pointer;

            transition:

                background .2s ease,

                transform .2s ease;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .nav:hover {

            background:
                rgba(255,255,255,.16);

        }


        .nav:active {

            transform:
                translateY(-50%) scale(.95);

        }


        #prev {

            left: 18px;

        }


        #next {

            right: 18px;

        }


        /* =====================================================
           COUNTER
        ===================================================== */

        #counter {

            position: absolute;

            bottom: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            color:
                rgba(255,255,255,.8);

            font-family:
                Arial,
                sans-serif;

            font-size: 13px;

            letter-spacing: 2px;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            padding:
                25px 20px 45px;

            color:
                #a2958e;

            font-size: 14px;

        }


        /* =====================================================
           LARGE LAPTOPS / DESKTOP
        ===================================================== */

        @media (min-width: 1400px) {

            main {

                padding-left: 40px;

                padding-right: 40px;

            }

            .gallery {

                gap: 18px;

            }

        }


        /* =====================================================
           TABLET / SMALL LAPTOP
        ===================================================== */

        @media (max-width: 1100px) {

            .gallery {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

            }


            .intro-photo {

                width: min(76vw, 600px);

                height: 90vh;

            }


            .intro-photo-frame {

                width: min(54vw, 580px);

                height: 89vh;

            }

        }


        /* =====================================================
           TABLET PORTRAIT
        ===================================================== */

        @media (max-width: 800px) {

            main {

                padding:
                    70px 18px 75px;

            }


            .heading {

                margin-bottom: 42px;

            }


            .gallery {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 9px;

            }


            .intro-photo {

                width: 88vw;

                height: 84vh;

            }


            .intro-photo-frame {

                width: 91vw;

                height: 86vh;

            }


            .intro-text {

                bottom: 7%;

            }


            .nav {

                width: 52px;

                height: 72px;

                font-size: 31px;

            }


            #prev {

                left: 8px;

            }


            #next {

                right: 8px;

            }

        }


        /* =====================================================
           MOBITEL
        ===================================================== */

        @media (max-width: 600px) {

            #intro::before {

                filter:
                    blur(25px);

                transform:
                    scale(1.10);

            }


            .intro-photo {

                width: 94vw;

                height: 82vh;

            }


            .intro-photo-frame {

                width: 95vw;

                height: 84vh;

                border-color:
                    rgba(255,255,255,.11);

            }


            .intro-text {

                bottom: 6%;

                width: 96vw;

                padding:
                    18px 5px;

            }


            .intro-content h1 {

                font-size:
                    clamp(22px, 7vw, 40px);

                letter-spacing: 0;

                white-space: nowrap;

            }


            .intro-line {

                width: 70px;

                margin:
                    14px auto;

            }


            .intro-date {

                font-size: 15px;

                letter-spacing: 4px;

            }


            .intro-scroll {

                display: none;

            }


            main {

                padding:
                    55px 7px 65px;

            }


            .heading {

                margin-bottom: 35px;

                padding:
                    0 10px;

            }


            .heading h2 {

                font-size: 30px;

            }


            .heading p {

                font-size: 14px;

            }


            .gallery {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 6px;

            }


            .photo {

                border-radius: 3px;

            }


            .photo img {

                min-height: 50px;

            }


            #lightbox {

                padding: 7px;

            }


            #lightbox-image {

                max-width: 98vw;

                max-height: 87vh;

            }


            #close {

                top: 9px;

                right: 10px;

                width: 43px;

                height: 43px;

                font-size: 34px;

            }


            .nav {

                width: 43px;

                height: 60px;

                font-size: 28px;

                background:
                    rgba(0,0,0,.20);

            }


            #prev {

                left: 2px;

            }


            #next {

                right: 2px;

            }


            #counter {

                bottom: 10px;

                font-size: 11px;

            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .intro-content h1 {

                font-size:
                    7.1vw;

            }


            .intro-date {

                font-size: 14px;

                letter-spacing: 3px;

            }


            .intro-photo {

                width: 96vw;

                height: 79vh;

            }


            .intro-photo-frame {

                width: 97vw;

                height: 81vh;

            }

        }


        /* =====================================================
           LANDSCAPE MOBITEL
        ===================================================== */

        @media (
            max-width: 900px
        ) and (
            orientation: landscape
        ) {

            .intro-photo {

                width: 52vw;

                height: 94vh;

            }


            .intro-photo-frame {

                width: 55vw;

                height: 94vh;

            }


            .intro-text {

                bottom: 2%;

                padding:
                    8px;

            }


            .intro-line {

                margin:
                    8px auto;

            }


            .intro-scroll {

                display: none;

            }


            .intro-content h1 {

                font-size:
                    clamp(20px, 4vw, 32px);

            }


            .intro-date {

                font-size: 13px;

            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            html {

                scroll-behavior:
                    auto;

            }


            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     INTRO
===================================================== -->

<section
    id="intro"
    class="loading-photo"
    aria-label="Nikolina i Kristijan"
>


    <!-- Glavna fotografija -->

    <div
        class="intro-photo"
        aria-hidden="true"
    ></div>


    <!-- Suptilni okvir -->

    <div
        class="intro-photo-frame"
        aria-hidden="true"
    ></div>


    <!-- Loader -->

    <div
        class="intro-loader"
        aria-hidden="true"
    ></div>


    <!-- Tekst -->

    <div class="intro-content">

        <div class="intro-text">

            <h1>
                Nikolina & Kristijan
            </h1>


            <div class="intro-line"></div>


            <div class="intro-date">
                05.06.2026
            </div>


            <div class="intro-scroll">
                Naša priča
            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <div class="heading">

        <h2>
            Naša svadbena priča
        </h2>


        <p>
            <span class="heart">
                ♥
            </span>


            05.06.2026

            <span class="heart">
                ♥
            </span>


        </p>

    </div>



    <!-- Loading -->

    <div id="loading">

        <div class="spinner"></div>

        <p>
            Učitavanje fotografija...
        </p>

    </div>



    <!-- Gallery -->

    <div
        id="gallery"
        class="gallery"
    ></div>



    <!-- Error -->

    <div id="error">

        <h3>
            Fotografije se nisu mogle učitati
        </h3>


        <p id="errorText"></p>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    Nikolina & Kristijan

    <span class="heart">
        ♥
    </span>

    05.06.2026

</footer>



<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Pregled fotografije"
>


    <!-- Close -->

    <button
        id="close"
        type="button"
        aria-label="Zatvori fotografiju"
    >
        &times;
    </button>


    <!-- Previous -->

    <button
        id="prev"
        class="nav"
        type="button"
        aria-label="Prethodna fotografija"
    >
        &#10094;
    </button>


    <!-- Image -->

    <img
        id="lightbox-image"
        alt="Nikolina & Kristijan"
        draggable="false"
    >


    <!-- Loader -->

    <div
        id="lightbox-loader"
        aria-hidden="true"
    ></div>


    <!-- Next -->

    <button
        id="next"
        class="nav"
        type="button"
        aria-label="Sljedeća fotografija"
    >
        &#10095;
    </button>


    <!-- Counter -->

    <div id="counter"></div>

</div>



<script>


/* =====================================================
   GOOGLE DRIVE POSTAVKE
===================================================== */


/*
    TVOJ GOOGLE DRIVE FOLDER
*/

const FOLDER_ID =
    "1lumAhhZFkOhQQhKUPUVGDFldnEOSYs5d";


/*
    GOOGLE API KEY
*/

const API_KEY =
    "AIzaSyCQ4UDTW5UlaIp-Jk4yR4Qse6TBOe47Bf8";


/*
    INTRO FOTOGRAFIJA
*/

const INTRO_IMAGE_ID =
    "1eydvV_aokZILZUnT0DiVF65T8Gf9BcqZ";



/* =====================================================
   POSTAVKE BRZINE
===================================================== */


/*
    Intro fotografija.

    1600px je dovoljno za desktop,
    tablet i mobitel, a znatno je brže
    od 3000/6000 verzije.
*/

const INTRO_IMAGE_SIZE = 1600;


/*
    Galerija.

    2400px daje dobru kvalitetu
    bez nepotrebno velikog fajla.
*/

const GALLERY_IMAGE_SIZE = 2400;


/*
    Lightbox.

    6000px se koristi samo kada
    korisnik stvarno otvori fotografiju.
*/

const LIGHTBOX_IMAGE_SIZE = 6000;


/*
    Minimalno vrijeme prikaza introa
    nakon što se fotografija učita.
*/

const INTRO_DISPLAY_TIME = 5000;


/*
    Maksimalno vrijeme čekanja.
    
    Ako Google Drive iz nekog razloga
    ne odgovori, stranica neće ostati
    zaglavljena.
*/

const INTRO_MAX_WAIT = 12000;



/* =====================================================
   VARIABLES
===================================================== */

let photos = [];

let currentIndex = 0;

let introFinished = false;



/* =====================================================
   ELEMENTS
===================================================== */

const intro =
    document.getElementById(
        "intro"
    );


const introPhoto =
    document.querySelector(
        ".intro-photo"
    );


const lightbox =
    document.getElementById(
        "lightbox"
    );


const lightboxImage =
    document.getElementById(
        "lightbox-image"
    );


const lightboxLoader =
    document.getElementById(
        "lightbox-loader"
    );


const counter =
    document.getElementById(
        "counter"
    );



/* =====================================================
   DRIVE IMAGE URL
===================================================== */

function driveImageUrl(
    id,
    size = 2400
) {

    return (

        "https://drive.google.com/thumbnail" +

        "?id=" +

        encodeURIComponent(id) +

        "&sz=w" +

        size

    );

}



/* =====================================================
   INTRO IMAGE
===================================================== */

function setupIntroImage() {

    const imageUrl =
        driveImageUrl(
            INTRO_IMAGE_ID,
            INTRO_IMAGE_SIZE
        );


    /*
        Postavi glavnu fotografiju.
    */

    introPhoto.style.backgroundImage =
        `url("${imageUrl}")`;


    /*
        Preload koristimo i kroz JS.
        
        Ovo osigurava da browser fotografiju
        počne učitavati odmah.
    */

    const preload =
        new Image();


    /*
        Visoki prioritet gdje browser podržava.
    */

    try {

        preload.fetchPriority =
            "high";

    }

    catch (error) {

        /*
            Ignoriraj ako browser
            ne podržava fetchPriority.
        */

    }


    preload.onload =
        function () {

            /*
                Fotografija je učitana.
            */

            intro.classList.add(
                "image-loaded"
            );


            intro.classList.remove(
                "loading-photo"
            );


            /*
                Intro se neće odmah maknuti.
                
                Korisnik dobije lijepih
                5 sekundi nakon učitavanja.
            */

            if (!introFinished) {

                setTimeout(
                    hideIntro,
                    INTRO_DISPLAY_TIME
                );

            }

        };


    preload.onerror =
        function () {

            console.warn(
                "Intro fotografija se nije mogla učitati."
            );


            /*
                Ako fotografija ne radi,
                ipak nastavljamo nakon kratkog vremena.
            */

            if (!introFinished) {

                setTimeout(
                    hideIntro,
                    1000
                );

            }

        };


    /*
        Pokreni učitavanje.
    */

    preload.src =
        imageUrl;

}



/* =====================================================
   HIDE INTRO
===================================================== */

function hideIntro() {

    if (introFinished) {

        return;

    }


    introFinished = true;


    intro.classList.add(
        "hidden"
    );

}


/*
    Sigurnosni timeout.
    
    Ako Drive dugo ne odgovara,
    maksimalno čekamo 12 sekundi.
*/

setTimeout(

    () => {

        if (!introFinished) {

            console.warn(
                "Intro timeout."
            );

            hideIntro();

        }

    },

    INTRO_MAX_WAIT

);



/* =====================================================
   LOAD PHOTOS
===================================================== */

async function loadPhotos() {

    const loading =
        document.getElementById(
            "loading"
        );


    const gallery =
        document.getElementById(
            "gallery"
        );


    const error =
        document.getElementById(
            "error"
        );


    const errorText =
        document.getElementById(
            "errorText"
        );


    if (

        API_KEY ===
        "OVDJE_ZALIJEPI_NOVI_API_KEY"

    ) {

        loading.style.display =
            "none";


        error.style.display =
            "block";


        errorText.textContent =
            "U HTML kod još nisi zalijepio Google API key.";

        return;

    }



    /*
        Tražimo samo slike
        unutar određenog foldera.
    */

    const query =

        `'${FOLDER_ID}' in parents and trashed = false and mimeType contains 'image/'`;


    const fields =

        "files(id,name,mimeType,thumbnailLink,size)";


    const url =

        "https://www.googleapis.com/drive/v3/files" +

        "?q=" +
        encodeURIComponent(query) +

        "&pageSize=1000" +

        "&orderBy=name" +

        "&fields=" +
        encodeURIComponent(fields) +

        "&key=" +
        encodeURIComponent(API_KEY);



    try {

        const response =
            await fetch(
                url
            );


        const data =
            await response.json();



        if (!response.ok) {

            throw new Error(

                data.error?.message ||

                "Google Drive API greška."

            );

        }



        photos =
            data.files || [];



        /*
            Prirodni redoslijed.
        */

        photos.sort(

            (a, b) =>

                a.name.localeCompare(

                    b.name,

                    undefined,

                    {
                        numeric: true,
                        sensitivity: "base"
                    }

                )

        );



        loading.style.display =
            "none";



        if (!photos.length) {

            error.style.display =
                "block";


            errorText.textContent =

                "U Google Drive folderu nema fotografija ili folder nije javno dostupan.";

            return;

        }



        /*
            Kreiraj galeriju.
        */

        photos.forEach(

            (photo, index) => {

                createPhoto(
                    photo,
                    index
                );

            }

        );

    }


    catch (errorObject) {

        console.error(
            errorObject
        );


        loading.style.display =
            "none";


        error.style.display =
            "block";


        errorText.textContent =
            errorObject.message;

    }

}



/* =====================================================
   CREATE PHOTO
===================================================== */

function createPhoto(
    photo,
    index
) {

    const gallery =
        document.getElementById(
            "gallery"
        );


    const container =
        document.createElement(
            "div"
        );


    container.className =
        "photo";


    container.style.animationDelay =

        `${Math.min(index * .025, 1)}s`;



    const image =
        document.createElement(
            "img"
        );


    /*
        Galerijska verzija.
    */

    image.src =
        driveImageUrl(
            photo.id,
            GALLERY_IMAGE_SIZE
        );


    image.alt =
        photo.name;


    /*
        Lazy loading.

        Browser sam odlučuje kada je
        pravo vrijeme za učitavanje.
    */

    image.loading =
        "lazy";


    image.decoding =
        "async";


    /*
        Fotografije blizu vrha imaju
        malo veći prioritet.
    */

    if (index < 4) {

        try {

            image.fetchPriority =
                "high";

        }

        catch (error) {

            /* ignoriraj */

        }

    }



    /*
        Fallback ako veća verzija
        ne uspije.
    */

    image.onerror =
        function () {

            if (
                !this.dataset.fallback
            ) {

                this.dataset.fallback =
                    "true";

                this.src =
                    driveImageUrl(
                        photo.id,
                        1600
                    );

            }

        };



    container.appendChild(
        image
    );


    gallery.appendChild(
        container
    );



    /*
        Otvaranje lightboxa.
    */

    container.addEventListener(

        "click",

        () => {

            openLightbox(
                index
            );

        }

    );

}



/* =====================================================
   OPEN LIGHTBOX
===================================================== */

function openLightbox(index) {

    currentIndex =
        index;


    lightbox.classList.add(
        "active"
    );


    document.body.classList.add(
        "no-scroll"
    );


    showCurrentImage();

}



/* =====================================================
   SHOW CURRENT IMAGE
===================================================== */

function showCurrentImage() {

    const photo =
        photos[currentIndex];


    if (!photo) {

        return;

    }


    /*
        Prikaži loader.
    */

    lightbox.classList.add(
        "loading"
    );


    /*
        Makni staru sliku
        dok se nova učitava.
    */

    lightboxImage.style.opacity =
        "0";


    /*
        Kreiramo Image objekt
        prije nego ga stavimo u lightbox.
    */

    const image =
        new Image();


    image.onload =
        function () {

            lightboxImage.src =
                this.src;

            lightboxImage.alt =
                photo.name;

            lightboxImage.style.opacity =
                "1";

            lightbox.classList.remove(
                "loading"
            );

        };


    image.onerror =
        function () {

            /*
                Fallback na manju verziju.
            */

            if (!this.dataset.fallback) {

                this.dataset.fallback =
                    "true";

                this.src =
                    driveImageUrl(
                        photo.id,
                        2400
                    );

                return;

            }


            lightbox.classList.remove(
                "loading"
            );

            lightboxImage.style.opacity =
                "1";

        };


    /*
        Velika verzija se učitava
        tek kada korisnik otvori sliku.
    */

    image.src =
        driveImageUrl(
            photo.id,
            LIGHTBOX_IMAGE_SIZE
        );


    /*
        Counter.
    */

    counter.textContent =

        `${currentIndex + 1} / ${photos.length}`;

}



/* =====================================================
   CLOSE LIGHTBOX
===================================================== */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );


    lightbox.classList.remove(
        "loading"
    );


    document.body.classList.remove(
        "no-scroll"
    );


    setTimeout(

        () => {

            if (

                !lightbox.classList.contains(
                    "active"
                )

            ) {

                lightboxImage.src =
                    "";

            }

        },

        300

    );

}



/* =====================================================
   NEXT PHOTO
===================================================== */

function nextPhoto() {

    if (!photos.length) {

        return;

    }


    currentIndex++;


    if (

        currentIndex >=
        photos.length

    ) {

        currentIndex = 0;

    }


    showCurrentImage();

}



/* =====================================================
   PREVIOUS PHOTO
===================================================== */

function previousPhoto() {

    if (!photos.length) {

        return;

    }


    currentIndex--;


    if (currentIndex < 0) {

        currentIndex =
            photos.length - 1;

    }


    showCurrentImage();

}



/* =====================================================
   BUTTONS
===================================================== */

document
    .getElementById("close")
    .addEventListener(

        "click",

        closeLightbox

    );



document
    .getElementById("next")
    .addEventListener(

        "click",

        event => {

            event.stopPropagation();

            nextPhoto();

        }

    );



document
    .getElementById("prev")
    .addEventListener(

        "click",

        event => {

            event.stopPropagation();

            previousPhoto();

        }

    );



/* =====================================================
   BACKGROUND CLICK
===================================================== */

lightbox.addEventListener(

    "click",

    event => {

        if (
            event.target ===
            lightbox
        ) {

            closeLightbox();

        }

    }

);



/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(

    "keydown",

    event => {

        if (

            !lightbox.classList.contains(
                "active"
            )

        ) {

            return;

        }


        switch (event.key) {

            case "Escape":

                closeLightbox();

                break;


            case "ArrowRight":

                nextPhoto();

                break;


            case "ArrowLeft":

                previousPhoto();

                break;

        }

    }

);



/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX = 0;

let touchStartY = 0;



lightbox.addEventListener(

    "touchstart",

    event => {

        if (!lightbox.classList.contains("active")) {

            return;

        }


        touchStartX =
            event.changedTouches[0].screenX;


        touchStartY =
            event.changedTouches[0].screenY;

    },

    {
        passive: true
    }

);



lightbox.addEventListener(

    "touchend",

    event => {

        if (!lightbox.classList.contains("active")) {

            return;

        }


        const touchEndX =
            event.changedTouches[0].screenX;


        const touchEndY =
            event.changedTouches[0].screenY;


        const diffX =
            touchEndX -
            touchStartX;


        const diffY =
            touchEndY -
            touchStartY;



        /*
            Premali ili uglavnom vertikalni
            pokret ignoriramo.
        */

        if (

            Math.abs(diffX) < 50 ||

            Math.abs(diffX) <
            Math.abs(diffY)

        ) {

            return;

        }



        if (diffX < 0) {

            nextPhoto();

        }

        else {

            previousPhoto();

        }

    },

    {
        passive: true
    }

);



/* =====================================================
   PRELOAD NEXT / PREVIOUS
===================================================== */


/*
    Kada korisnik otvori jednu fotografiju,
    u pozadini pokušavamo pripremiti
    sljedeću i prethodnu.
    
    Tako navigacija postaje puno brža.
*/

function preloadAdjacentImages() {

    if (!photos.length) {

        return;

    }


    const nextIndex =
        (currentIndex + 1) %
        photos.length;


    const previousIndex =
        (
            currentIndex -
            1 +
            photos.length
        ) %
        photos.length;



    [
        nextIndex,
        previousIndex
    ].forEach(

        index => {

            const image =
                new Image();

            image.src =
                driveImageUrl(
                    photos[index].id,
                    LIGHTBOX_IMAGE_SIZE
                );

        }

    );

}



/*
    Preload susjednih fotografija
    nakon što se trenutna učita.
*/

lightboxImage.addEventListener(

    "load",

    () => {

        preloadAdjacentImages();

    }

);



/* =====================================================
   START
===================================================== */


/*
    VAŽNO:
    
    Intro preload pokrećemo odmah.
*/

setupIntroImage();


/*
    Album također odmah počinje
    učitavanje u pozadini.
*/

loadPhotos();


</script>
