<!DOCTYPE html>
<html lang="hr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#171313"
    >

    <title>Nikolina & Kristijan</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #f8f6f3;
            color: #3d3734;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            overflow-x: hidden;
        }


        body.no-scroll {
            overflow: hidden;
        }



        /* =====================================================
           INTRO
        ===================================================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #171313;

            color: white;

            opacity: 1;

            visibility: visible;

            transition:
                opacity 1.6s ease,
                visibility 1.6s ease;

        }


        #intro.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }



        /* =====================================================
           BLURRED BACKGROUND
        ===================================================== */

        #intro::before {
    content: "";

    position: absolute;
    inset: -50px;

    background-image: url(
        "https://drive.google.com/thumbnail?id=1eydvV_aokZILZUnT0DiVF65T8Gf9BcqZ&sz=w3000"
    );

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: blur(35px);

    transform: scale(1.12);

    opacity: .8;

    z-index: 0;
}




        /* =====================================================
           DARK OVERLAY
        ===================================================== */

        #intro::after {
    content: "";

    position: absolute;
    inset: 0;

    background: rgba(0, 0, 0, .25);

    z-index: 1;

    pointer-events: none;
}




        /* =====================================================
           INTRO CONTENT
        ===================================================== */

        .intro-content {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}




        /* =====================================================
           MAIN PORTRAIT
        ===================================================== */

        .intro-photo {
    position: absolute;
    z-index: 2;

    width: min(80vw, 650px);
    height: 92vh;

    background-image: url(
        "https://drive.google.com/thumbnail?id=1eydvV_aokZILZUnT0DiVF65T8Gf9BcqZ&sz=w6000"
    );

    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;

    filter: none;

    /* lagana sjena samo oko fotografije */
    filter: drop-shadow(
        0 15px 35px rgba(0,0,0,.55)
    );
}




        /* =====================================================
           SUBTLE FRAME AROUND PHOTO
        ===================================================== */

        .intro-photo-frame {

            position: absolute;

            z-index: -1;

            width: min(45vw, 550px);

            height: min(91vh, 880px);

            border:

                1px solid
                rgba(255,255,255,.15);

            pointer-events: none;

        }



        /* =====================================================
           INTRO TEXT PANEL
        ===================================================== */

        .intro-text {

            position: absolute;

            left: 50%;

            bottom: 10%;

            transform: translateX(-50%);

            width: min(92vw, 900px);

            padding: 25px 20px;

            background:

                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0),
                    rgba(0,0,0,.18)
                );

            text-align: center;

        }



        .intro-content h1 {

            font-size:
                clamp(27px, 5vw, 70px);

            font-weight: normal;

            line-height: 1.1;

            letter-spacing: 1px;

            white-space: nowrap;

            color: #fff;

            text-shadow:

                0 3px 20px rgba(0,0,0,.75),

                0 1px 4px rgba(0,0,0,.9);

        }



        .intro-line {

            width: 90px;

            height: 1px;

            margin:

                20px auto;

            background:

                rgba(255,255,255,.8);

        }



        .intro-date {

            font-size:

                clamp(16px, 2.5vw, 25px);

            letter-spacing: 7px;

            color: rgba(255,255,255,.95);

            text-shadow:

                0 2px 12px rgba(0,0,0,.9);

        }



        .intro-scroll {

            margin-top: 22px;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: .65;

        }



        @keyframes introContentIn {

            from {

                opacity: 0;

                transform:
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }



        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: 100%;

            max-width: 1800px;

            margin: 0 auto;

            padding:

                85px
                30px
                90px;

        }



        /* =====================================================
           HEADING
        ===================================================== */

        .heading {

            text-align: center;

            margin-bottom: 55px;

        }



        .heading h2 {

            font-size:
                clamp(30px, 4vw, 50px);

            font-weight: normal;

            letter-spacing: .5px;

        }



        .heading p {

            margin-top: 14px;

            color: #968981;

            font-size: 16px;

        }



        .heart {

            color: #b99384;

            margin: 0 7px;

        }



        /* =====================================================
           LOADING
        ===================================================== */

        #loading {

            text-align: center;

            padding: 80px 20px;

            color: #998d86;

        }



        .spinner {

            width: 42px;

            height: 42px;

            margin:

                0 auto
                20px;

            border:

                2px solid
                #ded8d4;

            border-top-color:
                #998d86;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

        }



        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }



        /* =====================================================
           GALLERY
        ===================================================== */

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            align-items: start;

        }



        .photo {

            position: relative;

            overflow: hidden;

            background: #e9e5e1;

            border-radius: 5px;

            cursor: pointer;

            opacity: 0;

            transform:
                translateY(18px);

            animation:
                photoIn .7s ease forwards;

        }



        .photo img {

            display: block;

            width: 100%;

            height: auto;

            min-height: 80px;

            object-fit: contain;

            background: #eeeae7;

            transition:

                transform .6s ease,

                filter .5s ease;

        }



        .photo:hover img {

            transform:
                scale(1.025);

            filter:
                brightness(.88);

        }



        .photo::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    to bottom,
                    transparent 70%,
                    rgba(0,0,0,.15)
                );

            opacity: 0;

            transition:
                opacity .35s ease;

        }



        .photo:hover::after {

            opacity: 1;

        }



        @keyframes photoIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }



        /* =====================================================
           ERROR
        ===================================================== */

        #error {

            display: none;

            max-width: 650px;

            margin: 60px auto;

            padding: 30px;

            text-align: center;

            background: #f8eeee;

            color: #875f57;

            border-radius: 8px;

        }



        #error h3 {

            font-size: 22px;

            font-weight: normal;

            margin-bottom: 15px;

        }



        /* =====================================================
           LIGHTBOX
        ===================================================== */

        #lightbox {

            position: fixed;

            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:

                rgba(8,8,8,.97);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:

                opacity .3s ease,

                visibility .3s ease;

        }



        #lightbox.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }



        #lightbox-image {

            display: block;

            width: auto;

            height: auto;

            max-width: 94vw;

            max-height: 90vh;

            object-fit: contain;

            box-shadow:

                0 15px 70px
                rgba(0,0,0,.7);

            user-select: none;

            -webkit-user-drag: none;

            animation:
                lightboxIn .3s ease;

        }



        @keyframes lightboxIn {

            from {

                opacity: 0;

                transform:
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }



        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        #close {

            position: absolute;

            top: 15px;

            right: 22px;

            z-index: 20;

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 38px;

            font-weight: 200;

            cursor: pointer;

            border-radius: 50%;

            background:
                rgba(255,255,255,.06);

            transition:
                background .2s ease;

        }



        #close:hover {

            background:
                rgba(255,255,255,.15);

        }



        /* =====================================================
           LIGHTBOX NAVIGATION
        ===================================================== */

        .nav {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 20;

            width: 65px;

            height: 90px;

            border: 0;

            border-radius: 5px;

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 38px;

            cursor: pointer;

            transition:

                background .2s ease,

                transform .2s ease;

        }



        .nav:hover {

            background:
                rgba(255,255,255,.16);

        }



        #prev {

            left: 18px;

        }



        #next {

            right: 18px;

        }



        /* =====================================================
           COUNTER
        ===================================================== */

        #counter {

            position: absolute;

            bottom: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            color:
                rgba(255,255,255,.8);

            font-family:
                Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 2px;

        }



        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            padding:

                25px
                20px
                45px;

            color: #a2958e;

            font-size: 14px;

        }



        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {

            .gallery {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

            }

        }



        /* =====================================================
           MOBITEL
        ===================================================== */

        @media (max-width: 700px) {


            /* INTRO */

            .intro-photo {

                width: 90vw;

                height: 84vh;

            }


            .intro-photo-frame {

                width: 93vw;

                height: 87vh;

                border-color:
                    rgba(255,255,255,.11);

            }


            .intro-text {

                bottom: 7%;

                padding:
                    20px 10px;

            }


            .intro-content h1 {

                font-size:
                    clamp(23px, 7.5vw, 42px);

                letter-spacing: 0;

                white-space: nowrap;

            }


            .intro-line {

                width: 70px;

                margin:
                    15px auto;

            }


            .intro-date {

                font-size: 15px;

                letter-spacing: 4px;

            }


            .intro-scroll {

                display: none;

            }


            /* MAIN */

            main {

                padding:

                    55px
                    7px
                    65px;

            }


            .heading {

                margin-bottom: 35px;

                padding:
                    0 10px;

            }


            .heading h2 {

                font-size: 30px;

            }


            .heading p {

                font-size: 14px;

            }


            /* GALLERY */

            .gallery {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 6px;

            }


            .photo {

                border-radius: 3px;

            }


            .photo img {

                min-height: 50px;

            }


            /* LIGHTBOX */

            #lightbox {

                padding: 7px;

            }


            #lightbox-image {

                max-width: 98vw;

                max-height: 87vh;

            }


            #close {

                top: 9px;

                right: 10px;

                width: 43px;

                height: 43px;

                font-size: 34px;

            }


            .nav {

                width: 43px;

                height: 60px;

                font-size: 28px;

                background:
                    rgba(0,0,0,.2);

            }


            #prev {

                left: 2px;

            }


            #next {

                right: 2px;

            }


            #counter {

                bottom: 10px;

                font-size: 11px;

            }


        }



        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .intro-content h1 {

                font-size: 7.2vw;

            }


            .intro-date {

                font-size: 14px;

                letter-spacing: 3px;

            }

        }



        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;

            }

        }

    </style>

</head>



<body>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro">


    <!-- Glavna uspravna fotografija -->

    <div class="intro-photo"></div>


    <!-- Suptilni okvir -->

    <div class="intro-photo-frame"></div>


    <!-- Tekst -->

    <div class="intro-content">


        <div class="intro-text">

            <h1>
                Nikolina & Kristijan
            </h1>


            <div class="intro-line"></div>


            <div class="intro-date">
                05.06.2026
            </div>


            <div class="intro-scroll">
                Naša priča
            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <div class="heading">

        <h2>
            Naša svadbena priča
        </h2>


        <p>

            05.06.2026

            <span class="heart">
                ♥
            </span>

            Zauvijek zajedno

        </p>

    </div>



    <!-- Loading -->

    <div id="loading">

        <div class="spinner"></div>

        <p>
            Učitavanje fotografija...
        </p>

    </div>



    <!-- Gallery -->

    <div
        id="gallery"
        class="gallery"
    ></div>



    <!-- Error -->

    <div id="error">

        <h3>
            Fotografije se nisu mogle učitati
        </h3>


        <p id="errorText"></p>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    Nikolina & Kristijan

    <span class="heart">
        ♥
    </span>

    05.06.2026

</footer>



<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div id="lightbox">


    <div id="close">
        &times;
    </div>


    <button
        id="prev"
        class="nav"
        aria-label="Prethodna fotografija"
    >
        &#10094;
    </button>


    <img
        id="lightbox-image"
        alt="Nikolina & Kristijan"
    >


    <button
        id="next"
        class="nav"
        aria-label="Sljedeća fotografija"
    >
        &#10095;
    </button>


    <div id="counter"></div>

</div>



<script>


/* =====================================================
   GOOGLE DRIVE POSTAVKE
===================================================== */


/*
    TVOJ GOOGLE DRIVE FOLDER

    Ovo NE MIJENJAJ.
*/

const FOLDER_ID =
    "1lumAhhZFkOhQQhKUPUVGDFldnEOSYs5d";



/*
    NOVI GOOGLE API KEY

    OVDJE ZALIJEPI NOVI KLJUČ.

    Npr.:

    const API_KEY =
        "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxx";

*/

const API_KEY =
    "AIzaSyCQ4UDTW5UlaIp-Jk4yR4Qse6TBOe47Bf8";



/* =====================================================
   INTRO IMAGE
===================================================== */


/*
    ID tvoje posebne intro fotografije.

    Ovo NE MIJENJAJ.
*/

const INTRO_IMAGE_ID =
    "1eydvV_aokZILZUnT0DiVF65T8Gf9BcqZ";



/* =====================================================
   VARIABLES
===================================================== */

let photos = [];

let currentIndex = 0;



/* =====================================================
   DRIVE IMAGE URL
===================================================== */

function driveImageUrl(
    id,
    size = 2400
) {

    return (

        "https://drive.google.com/thumbnail" +

        "?id=" +

        encodeURIComponent(id) +

        "&sz=w" +

        size

    );

}



/* =====================================================
   INTRO IMAGE
===================================================== */

function setupIntroImage() {

    const imageUrl =
        driveImageUrl(
            INTRO_IMAGE_ID,
            3000
        );


    const introPhoto =
        document.querySelector(
            ".intro-photo"
        );


    introPhoto.style.backgroundImage =
        `url("${imageUrl}")`;



    /*
        Istu fotografiju koristimo
        za zamućenu pozadinu.
    */

    const style =
        document.createElement(
            "style"
        );


    style.textContent = `

        #intro::before {

            background-image:

                linear-gradient(
                    rgba(0,0,0,.28),
                    rgba(0,0,0,.50)
                ),

                url("${imageUrl}");

        }

    `;


    document.head.appendChild(
        style
    );

}



/* =====================================================
   LOAD PHOTOS
===================================================== */

async function loadPhotos() {

    const loading =
        document.getElementById(
            "loading"
        );


    const gallery =
        document.getElementById(
            "gallery"
        );


    const error =
        document.getElementById(
            "error"
        );


    const errorText =
        document.getElementById(
            "errorText"
        );



    if (

        API_KEY ===

        "OVDJE_ZALIJEPI_NOVI_API_KEY"

    ) {

        loading.style.display =
            "none";


        error.style.display =
            "block";


        errorText.textContent =

            "U HTML kod još nisi zalijepio novi Google API key.";

        return;

    }



    /*
        Tražimo samo slike
        unutar određenog foldera.
    */

    const query =

        `'${FOLDER_ID}' in parents and trashed = false and mimeType contains 'image/'`;



    const fields =

        "files(id,name,mimeType,thumbnailLink,size)";



    const url =

        "https://www.googleapis.com/drive/v3/files" +

        "?q=" +

        encodeURIComponent(query) +

        "&pageSize=1000" +

        "&orderBy=name" +

        "&fields=" +

        encodeURIComponent(fields) +

        "&key=" +

        encodeURIComponent(API_KEY);



    try {

        const response =
            await fetch(url);


        const data =
            await response.json();



        if (!response.ok) {

            throw new Error(

                data.error?.message ||

                "Google Drive API greška."

            );

        }



        photos =
            data.files || [];



        /*
            Sortiramo fotografije
            prirodnim redoslijedom.
        */

        photos.sort(

            (a, b) =>

                a.name.localeCompare(

                    b.name,

                    undefined,

                    {

                        numeric: true,

                        sensitivity:
                            "base"

                    }

                )

        );



        loading.style.display =
            "none";



        if (!photos.length) {

            error.style.display =
                "block";


            errorText.textContent =

                "U Google Drive folderu nema fotografija ili folder nije javno dostupan.";

            return;

        }



        /*
            Kreiramo galeriju.
        */

        photos.forEach(

            (photo, index) => {

                createPhoto(
                    photo,
                    index
                );

            }

        );

    }


    catch (errorObject) {

        console.error(
            errorObject
        );


        loading.style.display =
            "none";


        error.style.display =
            "block";


        errorText.textContent =
            errorObject.message;

    }

}



/* =====================================================
   CREATE PHOTO
===================================================== */

function createPhoto(
    photo,
    index
) {

    const gallery =
        document.getElementById(
            "gallery"
        );


    const container =
        document.createElement(
            "div"
        );


    container.className =
        "photo";


    container.style.animationDelay =

        `${Math.min(index * .025, 1)}s`;



    const image =
        document.createElement(
            "img"
        );


    /*
        2400px verzija za galeriju.

        Fotografija zadržava
        svoj originalni omjer.
    */

    image.src =
        driveImageUrl(
            photo.id,
            2400
        );


    image.alt =
        photo.name;


    /*
        Lazy loading.
    */

    image.loading =
        "lazy";


    image.decoding =
        "async";



    /*
        Ako browser ne može učitati
        veću verziju, pokušaj ponovno
        s manjom verzijom.
    */

    image.onerror =
        function () {

            if (
                !this.dataset.fallback
            ) {

                this.dataset.fallback =
                    "true";

                this.src =
                    driveImageUrl(
                        photo.id,
                        1600
                    );

            }

        };



    container.appendChild(
        image
    );


    gallery.appendChild(
        container
    );



    container.addEventListener(

        "click",

        () => {

            openLightbox(
                index
            );

        }

    );

}



/* =====================================================
   LIGHTBOX ELEMENTS
===================================================== */

const lightbox =
    document.getElementById(
        "lightbox"
    );


const lightboxImage =
    document.getElementById(
        "lightbox-image"
    );


const counter =
    document.getElementById(
        "counter"
    );



/* =====================================================
   OPEN LIGHTBOX
===================================================== */

function openLightbox(index) {

    currentIndex =
        index;


    showCurrentImage();


    lightbox.classList.add(
        "active"
    );


    document.body.classList.add(
        "no-scroll"
    );

}



/* =====================================================
   SHOW CURRENT IMAGE
===================================================== */

function showCurrentImage() {

    const photo =
        photos[currentIndex];


    if (!photo) {

        return;

    }



    /*
        Velika verzija.

        Pokušavamo dobiti vrlo veliku
        verziju fotografije.
    */

    const largeUrl =
        driveImageUrl(
            photo.id,
            6000
        );


    lightboxImage.src =
        largeUrl;


    lightboxImage.alt =
        photo.name;


    counter.textContent =

        `${currentIndex + 1} / ${photos.length}`;

}



/* =====================================================
   CLOSE LIGHTBOX
===================================================== */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );


    document.body.classList.remove(
        "no-scroll"
    );


    setTimeout(

        () => {

            if (

                !lightbox.classList.contains(
                    "active"
                )

            ) {

                lightboxImage.src =
                    "";

            }

        },

        300

    );

}



/* =====================================================
   NEXT
===================================================== */

function nextPhoto() {

    if (!photos.length) {

        return;

    }


    currentIndex++;


    if (

        currentIndex >=
        photos.length

    ) {

        currentIndex = 0;

    }


    showCurrentImage();

}



/* =====================================================
   PREVIOUS
===================================================== */

function previousPhoto() {

    if (!photos.length) {

        return;

    }


    currentIndex--;


    if (currentIndex < 0) {

        currentIndex =
            photos.length - 1;

    }


    showCurrentImage();

}



/* =====================================================
   BUTTONS
===================================================== */

document
    .getElementById("close")
    .addEventListener(

        "click",

        closeLightbox

    );



document
    .getElementById("next")
    .addEventListener(

        "click",

        event => {

            event.stopPropagation();

            nextPhoto();

        }

    );



document
    .getElementById("prev")
    .addEventListener(

        "click",

        event => {

            event.stopPropagation();

            previousPhoto();

        }

    );



/* =====================================================
   BACKGROUND CLICK
===================================================== */

lightbox.addEventListener(

    "click",

    event => {

        if (
            event.target ===
            lightbox
        ) {

            closeLightbox();

        }

    }

);



/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(

    "keydown",

    event => {

        if (

            !lightbox.classList.contains(
                "active"
            )

        ) {

            return;

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeLightbox();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPhoto();

        }

    }

);



/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX = 0;

let touchStartY = 0;



lightbox.addEventListener(

    "touchstart",

    event => {

        touchStartX =
            event.changedTouches[0].screenX;


        touchStartY =
            event.changedTouches[0].screenY;

    },

    {
        passive: true
    }

);



lightbox.addEventListener(

    "touchend",

    event => {

        const touchEndX =
            event.changedTouches[0].screenX;


        const touchEndY =
            event.changedTouches[0].screenY;


        const diffX =
            touchEndX -
            touchStartX;


        const diffY =
            touchEndY -
            touchStartY;



        /*
            Ignoriraj vertikalne pokrete.
        */

        if (

            Math.abs(diffX) < 50 ||

            Math.abs(diffX) <
            Math.abs(diffY)

        ) {

            return;

        }



        if (diffX < 0) {

            nextPhoto();

        }

        else {

            previousPhoto();

        }

    },

    {
        passive: true
    }

);



/* =====================================================
   INTRO - 5 SEKUNDI
===================================================== */

setTimeout(

    () => {

        document
            .getElementById("intro")
            .classList.add(
                "hidden"
            );

    },

    5000

);



/* =====================================================
   START
===================================================== */

setupIntroImage();

loadPhotos();


</script>
